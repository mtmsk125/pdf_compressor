<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اتصل بنا | فالكون PDF 🦅</title>
<style>
body { background: #0b0f19; color: #f9fafb; font-family: sans-serif; padding: 40px 10%; line-height: 1.8; }
h1, h2 { color: #f59e0b; margin-top: 20px; }
input, textarea { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; }
button { background: #f59e0b; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
a { color: #f59e0b; text-decoration: none; }
</style>
</head>
<body>
<h1>تواصل معنا (Contact Us)</h1>
<p>هل لديك استفسار أو اقتراح لتطوير موقع فالكون PDF؟ يسعدنا التواصل معك دائماً.</p>

<form onsubmit="alert('تم إرسال رسالتك بنجاح!'); return false;" style="max-width: 500px;">
    <label>الاسم الكامل:</label>
    <input type="text" required placeholder="ادخل اسمك">

    <label>البريد الإلكتروني:</label>
    <input type="email" required placeholder="name@example.com">

    <label>الرسالة:</label>
    <textarea rows="5" required placeholder="اكتب استفسارك هنا..."></textarea>

    <button type="submit">إرسال الرسالة 🚀</button>
</form>

<p style="margin-top: 30px;"><a href="/">← العودة للصفحة الرئيسية</a></p>
</body>
</html>
