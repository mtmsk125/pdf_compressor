<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#1e293b,#0f172a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.card {
    background:#111827;
    padding:30px;
    border-radius:16px;
    width:350px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

input {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button {
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:#16a34a;
}

a {
    color:#93c5fd;
    text-decoration:none;
    display:block;
    margin-top:10px;
    text-align:center;
}
</style>

</head>

<body>

<div class="card">

<h2>📝 Register</h2>

<form method="post">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Create Account</button>
</form>

<a href="/login">Already have account?</a>

</div>

</body>
</html>
