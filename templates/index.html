<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF Falcon</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>

body{
background:#0f172a;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:tahoma;
padding:20px;
}

.box{
background:#1e293b;
padding:40px;
border-radius:20px;
width:100%;
max-width:650px;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.logo{
font-size:60px;
text-align:center;
}

.drop-zone{
border:2px dashed #3b82f6;
padding:40px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.drop-zone:hover{
background:#172554;
}

.file-name{
margin-top:15px;
color:#94a3b8;
}

.btn-main{
width:100%;
background:#3b82f6;
border:none;
color:white;
padding:15px;
border-radius:10px;
font-size:18px;
margin-top:20px;
}

.btn-main:hover{
background:#2563eb;
}

.note{
margin-top:20px;
font-size:13px;
color:#94a3b8;
text-align:center;
}

</style></head><body><div class="box"><div class="logo">🦅</div><h2 class="text-center">PDF Falcon</h2><p class="text-center text-secondary">
ضغط ملفات PDF بسرعة وجودة عالية
</p><form method="POST" enctype="multipart/form-data"><div class="drop-zone" onclick="document.getElementById('pdf').click()"><div style="font-size:50px;">📄</div><h5>اختر ملف PDF</h5><input
type="file"
id="pdf"
name="pdf_file"
accept=".pdf"
hidden
required>

<div class="file-name" id="fileName">
لم يتم اختيار ملف
</div></div><button type="submit" class="btn-main">
🚀 ضغط الملف
</button></form><div class="note">
⚡ أول عملية قد تستغرق عدة ثوانٍ إذا كان الخادم في وضع السكون
</div></div><script>

const input=document.getElementById('pdf');

input.addEventListener('change',function(){

if(this.files.length>0){

document.getElementById('fileName').innerText=
this.files[0].name;

}

});

</script></body>
</html>
