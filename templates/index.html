<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>فالكون Falcon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#0a0f1e;color:#e2e8f0}
header{background:#0f172a;border-bottom:1px solid #1e293b;padding:18px 5%}
.logo{font-size:28px;font-weight:800;color:#fbbf24}
.logo span{color:#3b82f6}
.hero{text-align:center;padding:80px 20px}
.hero h1{font-size:52px;margin-bottom:20px;font-weight:800}
.hero h1 span{color:#fbbf24}
.upload-box{max-width:750px;margin:0 auto 80px;background:linear-gradient(145deg,#1e293b,#0f172a);border:2px dashed #fbbf24;border-radius:25px;padding:70px 40px;box-shadow:0 0 50px rgba(251,191,36,0.15)}
.upload-icon{font-size:75px;margin-bottom:25px;filter:drop-shadow(0 0 25px #fbbf24)}
.btn-primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0a0f1e;border:none;padding:18px 50px;border-radius:12px;font-size:19px;font-weight:bold;cursor:pointer}
input[type=file]{display:none}
.tools-grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:0 5% 100px}
.tool-card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:35px 20px;text-align:center;transition:0.3s;cursor:pointer}
.tool-card:hover{border-color:#fbbf24;transform:translateY(-7px)}
.tool-icon{font-size:45px;margin-bottom:18px}
.tool-card h4{font-size:19px;margin-bottom:10px;color:#fbbf24}
.badge{background:#3b82f6;color:white;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:bold}
@media(max-width:900px){.tools-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.tools-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header><div class="logo">🦅 فالكون <span>Falcon</span></div></header>

<section class="hero">
<h1>حلّق بأعلى مستوى مع <span>فالكون Falcon</span></h1>

<div class="upload-box">
<div class="upload-icon">🦅</div>
<h3>ضغط PDF فالكون</h3>
<form method="post" enctype="multipart/form-data">
<input type="file" name="file" id="compress-file" accept=".pdf" required onchange="this.form.submit()">
<label for="compress-file" class="btn-primary">اختر الملف للضغط</label>
</form>
</div>
</section>

<section class="tools-grid">
<div class="tool-card" style="opacity:0.6">
<div class="tool-icon">📄</div>
<h4>PDF ↔ Word</h4>
<p>تحويل ذكي <span class="badge">قريبا</span></p>
</div>

<div class="tool-card" onclick="splitClick()">
<div class="tool-icon">✂️</div>
<h4>فصل PDF</h4>
<p>استخرج الصفحات اللي بدك إياها</p>
</div>

<div class="tool-card" onclick="mergeClick()">
<div class="tool-icon">🔗</div>
<h4>دمج PDF</h4>
<p>ادمج عدة ملفات بملف واحد</p>
</div>

<div class="tool-card" onclick="document.getElementById('compress-file').click()">
<div class="tool-icon">🗜️</div>
<h4>ضغط PDF فالكون</h4>
<p>ضغط قوي حتى 70% - تقنية Ghostscript</p>
</div>

<div class="tool-card" style="opacity:0.6;grid-column:4">
<div class="tool-icon">📐</div>
<h4>DWG ↔ PDF</h4>
<p>للمهندسين <span class="badge">حصري</span></p>
</div>
</section>

<!-- فورم الدمج -->
<form action="/merge" method="post" enctype="multipart/form-data" id="merge-form" style="display:none">
<input type="file" name="files" id="merge-files" multiple accept=".pdf">
</form>

<!-- فورم الفصل -->
<form action="/split" method="post" enctype="multipart/form-data" id="split-form" style="display:none">
<input type="file" name="file" id="split-file" accept=".pdf">
<input type="hidden" name="pages" id="split-pages">
</form>

<script>
function mergeClick(){
    document.getElementById('merge-files').click();
}
document.getElementById('merge-files').onchange = function(){
    if(this.files.length > 1){
        document.getElementById('merge-form').submit();
    } else {
        alert('اختر ملفين PDF على الأقل للدمج');
    }
}

function splitClick(){
    let pages = prompt('اكتب أرقام الصفحات اللي بدك تفصلها:\n\nمثال: 1-3,5,7-9\nيعني صفحات 1 إلى 3 + صفحة 5 + 7 إلى 9');
    if(pages && pages.trim() != ''){
        document.getElementById('split-pages').value = pages;
        document.getElementById('split-file').click();
    }
}
document.getElementById('split-file').onchange = function(){
    if(this.files.length > 0){
        document.getElementById('split-form').submit();
    }
}
</script>

</body>
</html>
