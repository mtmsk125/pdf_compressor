<div class="box">
    <h2>اضغط ملف PDF</h2>
    <p>قلل حجم ملفاتك 80% بضغطة وحدة</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data" id="compressForm">
        <input type="file" name="file" accept=".pdf" required id="fileInput">
        <button type="submit" class="btn" id="submitBtn">اضغط الآن</button>
    </form>
</div>

<script>
document.getElementById('compressForm').addEventListener('submit', function() {
    const btn = document.getElementById('submitBtn');
    const file = document.getElementById('fileInput').files[0];

    if(file) {
        btn.disabled = true;
        btn.innerHTML = '⏳ جاري الضغط... انتظر ' + (file.size/1024/1024).toFixed(1) + 'MB';
        btn.style.background = '#6b7280';
        btn.style.cursor = 'not-allowed';
    }
});
</script>
