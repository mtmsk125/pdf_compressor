<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Compressor Pro</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .drop {
            border: 2px dashed #4f46e5;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            cursor: pointer;
        }

        input {
            width: 100%;
            margin-top: 15px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .small {
            font-size: 12px;
            color: gray;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>📄 PDF Compressor Pro</h1>
    <p>Fast • Secure • High Compression</p>

    <form action="/compress" method="post" enctype="multipart/form-data">

        <div class="drop">
            <input type="file" name="file" multiple required>
        </div>

        <select name="level">
            <option value="low">High Quality</option>
            <option value="medium" selected>Balanced</option>
            <option value="high">Maximum Compression</option>
        </select>

        <button type="submit">Compress Now</button>

    </form>

    <div class="small">
        Powered by Ghostscript Engine
    </div>

</div>

</body>
</html>
