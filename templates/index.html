<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Compressor Pro</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#4f46e5,#06b6d4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card {
    background:white;
    padding:30px;
    border-radius:18px;
    width:400px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    text-align:center;
}

input, select {
    width:100%;
    margin-top:10px;
    padding:10px;
}

button {
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover {
    background:#3730a3;
}

.small {
    font-size:12px;
    color:gray;
}
</style>
</head>

<body>

<div class="card">

<h2>📄 PDF Compressor Pro</h2>
<p class="small">Welcome {{ user }}</p>

<form action="/compress" method="post" enctype="multipart/form-data">

<input type="file" name="file" required>

<select name="level">
    <option value="low">Fast Compression</option>
    <option value="medium" selected>Balanced</option>
    <option value="high">Maximum Compression</option>
</select>

<button type="submit">Compress PDF</button>

</form>

</div>

</body>
</html>
