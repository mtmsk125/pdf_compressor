<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF Compressor Pro</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        input, select {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            background: #4f46e5;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        a {
            display: block;
            margin-top: 10px;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>📄 PDF Compressor Pro</h2>
    <p>Welcome {{ user }}</p>

    <a href="/logout">Logout</a>

    <form action="/compress" method="post" enctype="multipart/form-data">

        <input type="file" name="file" multiple required>

        <select name="level">
            <option value="low">High Quality</option>
            <option value="medium" selected>Balanced</option>
            <option value="high">Maximum Compression</option>
        </select>

        <button type="submit">Compress</button>

    </form>

</div>

</body>
</html>
