<!DOCTYPE html>
<html>
<head>
    <title>PDF Compression Store</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            width: 100%;
            background: #2d6cdf;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1b4fb5;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>📦 PDF Compression Store</h2>

    <form action="/compress" method="post" enctype="multipart/form-data">

        <input type="file" name="file" multiple required>

        <select name="level">
            <option value="low">جودة عالية (حجم أكبر)</option>
            <option value="medium" selected>متوسط (مفضل)</option>
            <option value="high">ضغط قوي جداً</option>
        </select>

        <button type="submit">ضغط الملفات</button>

    </form>

</div>

</body>
</html>
