<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>تم الضغط - فالكون</title>
<style>
body{background:#0a0f1e;color:#e2e8f0;font-family:'Segoe UI',Tahoma;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #fbbf24;border-radius:25px;padding:50px 40px;text-align:center;max-width:450px;box-shadow:0 0 60px rgba(251,191,36,0.2)}
.logo{font-size:50px;margin-bottom:15px}
h2{color:#fbbf24;font-size:28px;margin-bottom:30px}
.stat{margin:20px 0;font-size:18px}
.stat span{color:#94a3b8}
.saved{color:#22c55e;font-size:36px;font-weight:bold;margin:25px 0;text-shadow:0 0 20px rgba(34,197,94,0.5)}
.btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;border:none;padding:18px 50px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;transition:0.2s;box-shadow:0 8px 25px rgba(34,197,94,0.3)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(34,197,94,0.5)}
</style>
</head>
<body>
<div class="box">
<div class="logo">🦅</div>
<h2>Compression Done</h2>
<div class="stat"><span>📦 الحجم الأصلي:</span> {{ orig_size }} KB</div>
<div class="stat"><span>📦 الحجم بعد الضغط:</span> {{ comp_size }} KB</div>
<div class="saved">وفرت {{ saved }}%</div>
<a href="/download/{{ filename }}" class="btn">⬇️ تحميل الملف المضغوط</a>
</div>
</body>
</html>
