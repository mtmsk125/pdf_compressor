<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>ضاغط PDF 100MB مجاني</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
body{font-family:Arial;background:#667eea;padding:50px;text-align:center;color:white}
.box{background:white;color:#333;padding:40px;border-radius:20px;max-width:500px;margin:auto}
.btn{background:#667eea;color:white;padding:15px 40px;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:20px}
#status{margin-top:20px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>📄 ضاغط PDF</h1>
<p>الضغط بصير بجهازك 100% - ما في رفع عالسيرفر</p>
<input type="file" id="file" accept=".pdf">
<br>
<button class="btn" onclick="compress()">اضغط الملف</button>
<div id="status"></div>
</div>

<script>
async function compress() {
  const file = document.getElementById('file').files[0];
  if(!file) return alert('اختار ملف');

  document.getElementById('status').innerText = 'جاري الضغط... استنى شوي';

  const bytes = await file.arrayBuffer();
  const pdfDoc = await PDFLib.PDFDocument.load(bytes);
  const pdfBytes = await pdfDoc.save({useObjectStreams: false});

  const blob = new Blob([pdfBytes], {type: 'application/pdf'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'compressed_' + file.name;
  link.click();

  document.getElementById('status').innerText = 'تم! نزل الملف المضغوط';
}
</script>
</body>
</html>
