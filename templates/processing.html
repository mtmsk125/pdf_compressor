<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فالكون قاعد يضغط...</title>
<style>
body {
    background: #0a0e27;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.box {
    text-align: center;
    border: 2px dashed #ffc107;
    padding: 60px 40px;
    border-radius: 20px;
    max-width: 500px;
}
.spinner {
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #ffc107;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
    margin: 0 auto 30px;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
h2 {
    color: #ffc107;
    font-size: 24px;
    margin-bottom: 10px;
}
p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}
#timer {
    font-size: 28px;
    color: #00ff88;
    font-weight: bold;
    margin-top: 20px;
}
#timer.slow { color: #ff4444; }
.btn {
    margin-top: 30px;
    padding: 12px 30px;
    background: #ffc107;
    color: #0a0e27;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}
</style>
</head>
<body>
<div class="box">
    <div class="spinner"></div>
    <h2>فالكون قاعد يضغط ملفك...</h2>
    <p>باستخدم تقنية Ghostscript القوية</p>
    <div id="timer">الوقت: <span id="seconds">0</span> ثانية ⏱️</div>
    <button id="dlBtn" class="btn" onclick="location.href='/download/compressed_{{filename}}'">تحميل الملف المضغوط</button>
</div>

<script>
let startTime = Date.now();
let checkInterval = setInterval(function() {
    let elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('seconds').innerText = elapsed;
    if(elapsed > 30) document.getElementById('timer').classList.add('slow');
    
    // فحص كل 3 ثواني اذا الملف جاهز
    fetch('/download/compressed_{{filename}}', {method: 'HEAD'}).then(r => {
        if(r.ok) {
            clearInterval(checkInterval);
            document.getElementById('dlBtn').style.display = 'inline-block';
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('h2').innerText = 'تم الضغط بنجاح! ✅';
        }
    }).catch(()=>{});
}, 3000);
</script>
</body>
</html>
